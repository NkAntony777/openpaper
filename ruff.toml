# Ruff config at the repo root so every path (engine/, tests/, scripts/)
# resolves the same settings — engine/pyproject.toml deliberately carries none.
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "node_modules",
    "tests/outputs",
    "opendraft.egg-info",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (likely-bug patterns)
]
ignore = [
    "E501",  # line length is enforced by `ruff format`, not the linter
    # This repo runs from source via sys.path.insert(...) before importing
    # sibling top-level packages (agent_tools, utils, harness, ...) — imports
    # deliberately sit after those inserts.
    "E402",
]
