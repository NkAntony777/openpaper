[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpaper"
version = "2.0.0"
description = "Agent-native academic paper writing harness built on OpenDraft"
readme = "README.md"
license = {text = "MIT"}
# OpenPaper maintains the fork; OpenDraft (Federico De Ponte) is the upstream
# project — see README "Credits & license". The console-script name stays
# `opendraft` for compatibility with the pi extension's OPENDRAFT_BIN contract.
authors = [
    {name = "NKAntony777"}
]
maintainers = [
    {name = "NKAntony777"}
]
keywords = [
    "academic-writing",
    "agent-harness",
    "ai",
    "research",
    "citation-management",
    "llm",
    "pdf-generation",
    "scholarly"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.20.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "pybtex>=0.24.0",
    "citeproc-py>=0.6.0",
    "PyYAML>=6.0.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    "python-docx>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]
docker = [
    "streamlit>=1.28.0",
]
pdf = [
    "pymupdf>=1.23.0",
]
audio = [
    "requests>=2.31.0",
]
all = [
    "openpaper[dev,docker,pdf,audio]",
]

[project.urls]
Homepage = "https://github.com/NkAntony777/openpaper"
Documentation = "https://github.com/NkAntony777/openpaper/tree/master/docs"
Repository = "https://github.com/NkAntony777/openpaper"
Changelog = "https://github.com/NkAntony777/openpaper/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/NkAntony777/openpaper/issues"

[project.scripts]
opendraft = "opendraft.cli:main"
draft-ai = "opendraft.cli:main"
opendraft-tldr = "tldr:main"
opendraft-digest = "digest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opendraft*", "utils*", "concurrency*", "phases*", "agent_tools*", "harness*"]

[tool.setuptools]
py-modules = ["config", "tldr", "digest"]
include-package-data = true

[tool.setuptools.package-data]
"opendraft" = ["prompts/*.md", "prompts/**/*.md"]
"*" = ["*.md"]

# NOTE: pytest config lives in the repo-root pytest.ini and ruff config in the
# repo-root ruff.toml (single sources of truth for CI and local runs). No
# [tool.pytest.ini_options] or [tool.ruff] here on purpose — second copies
# would silently change behavior depending on the cwd a tool is invoked from.
