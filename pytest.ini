[pytest]
testpaths = tests
addopts = -m "not integration and not network" --strict-markers
norecursedirs = tests/scripts tests/exploratory
filterwarnings =
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai\.types
markers =
    integration: tests requiring external API/network access
    network: tests hitting live provider APIs (run locally with -m network)
    slow: long-running tests (deselect with -m "not slow")
