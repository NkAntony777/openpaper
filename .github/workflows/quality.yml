name: Quality Gates

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node (TS extension smoke)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Install pi packages (TS extension smoke + schema parity)
        run: |
          npm install --no-package-lock --no-save @earendil-works/pi-coding-agent

      - name: Compile Python Sources
        run: |
          python -W error::SyntaxWarning -m compileall -q engine tests

      - name: Lint (ruff check + format)
        run: |
          python -m ruff check engine tests scripts
          python -m ruff format --check engine tests scripts

      - name: Block Deprecated Gemini Imports
        shell: bash
        run: |
          set -euo pipefail
          legacy_imports="$(git grep -nE '^[[:space:]]*(import[[:space:]]+google\.generativeai|from[[:space:]]+google\.generativeai)' -- engine tests || true)"
          if [[ -n "$legacy_imports" ]]; then
            echo "Deprecated google.generativeai imports found:"
            echo "$legacy_imports"
            exit 1
          fi

      - name: Block Deprecated Gemini Dependency Pin
        shell: bash
        run: |
          set -euo pipefail
          legacy_pins="$(git grep -n 'google-generativeai' -- requirements.txt engine/requirements.txt engine/pyproject.toml || true)"
          if [[ -n "$legacy_pins" ]]; then
            echo "Deprecated google-generativeai pins found:"
            echo "$legacy_pins"
            exit 1
          fi

      - name: Run Test Suite
        env:
          # TS extension smoke + TS/Python schema parity (self-skip when missing)
          PI_NODE_MODULES: ${{ github.workspace }}/node_modules
          OD_PY: python
        run: |
          # pytest.ini deselects `-m integration` and `-m network`; the gold
          # gates and the TS-smoke wrapper (incl. schema parity) run inside
          # the suite — on Linux too, not just the dev box.
          python -m pytest tests -q
